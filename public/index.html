  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

  <!-- Meta Pixel: NOT loaded here any more.
       It used to fire fbq('track','PageView') for every visitor, while
       /cookie-preferences offered an Analytics toggle that saved nothing. It is
       loaded from src/lib/consent.js, and only after someone agrees to it. -->


  <!-- ================= GOOGLE ANALYTICS (GA4) ================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DTWCZWSE3L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // Consent Mode: everything optional is denied until the visitor chooses.
    // src/lib/consent.js sends the update when they do.
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    gtag('js', new Date());

    // Important for React SPA (page views handled via GATracker)
    gtag('config', 'G-DTWCZWSE3L', {
      send_page_view: false
    });
  </script>
  <!-- ================= END GOOGLE ANALYTICS ================= -->

  <title>Ivish AI</title>
</head>

</body>
